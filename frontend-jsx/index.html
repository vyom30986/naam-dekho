<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#FAF8F3" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <title>Naam Dekho — One name. Every check that matters.</title>
  <meta name="description" content="India-first name verification. Legal, domain, social, marketplace, brand and linguistic checks in one search." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,300;1,9..144,400;1,9..144,500&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+Devanagari:wght@400;500;600&display=swap" rel="stylesheet" />
  <script>
    /* Before React, before first paint. A stored choice is stamped on <html>
       here; 'system' deliberately stamps nothing and lets the stylesheet's
       media query decide. Without this the page paints cream for one frame
       and then flips, which looks broken on a phone at night. */
    (function () {
      try {
        var t = localStorage.getItem('nd.theme');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
