<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#FAF8F3" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <title>Naam Dekho — One name. Every check that matters.</title>
  <meta name="description" content="India-first name verification. Legal, domain, social, marketplace, brand and linguistic checks in one search." />
  <link rel="canonical" href="https://naamdekho.net/" />

  <!-- Social share card.
       These are deliberately STATIC, not set by useSeo(). WhatsApp, Facebook,
       LinkedIn, Slack and X fetch the raw HTML and never execute JavaScript,
       so anything useSeo() adds on mount is invisible to them. Google is the
       only crawler that renders JS. Without the block below every share of
       naamdekho.net — including the link in the Instagram bio — renders as a
       bare grey link with no image.
       og:image must be an absolute URL; a relative path is dropped. -->
  <meta property="og:site_name" content="Naam Dekho" />
  <meta property="og:locale" content="en_IN" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://naamdekho.net/" />
  <meta property="og:title" content="One name. Every check that matters." />
  <meta property="og:description" content="Domains, social handles, trademarks, brand collisions and Chaldean numerology — checked across India in one search." />
  <meta property="og:image" content="https://naamdekho.net/og.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="Naam Dekho — one name, every check that matters." />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="One name. Every check that matters." />
  <meta name="twitter:description" content="Domains, social handles, trademarks, brand collisions and Chaldean numerology — checked across India in one search." />
  <meta name="twitter:image" content="https://naamdekho.net/og.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,300;1,9..144,400;1,9..144,500&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+Devanagari:wght@400;500;600&display=swap" rel="stylesheet" />
  <script>
    /* Before React, before first paint. A stored choice is stamped on <html>
       here; 'system' deliberately stamps nothing and lets the stylesheet's
       media query decide. Without this the page paints cream for one frame
       and then flips, which looks broken on a phone at night. */
    (function () {
      try {
        var t = localStorage.getItem('nd.theme');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
